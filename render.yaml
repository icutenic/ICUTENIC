services:
  - type: web
    name: icutenic
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ADMIN_EMAIL
        value: shopicutenic@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: DATA_DIR
        value: /data
      - key: NODE_ENV
        value: production
    disk:
      name: icutenic-data
      mountPath: /data
      sizeGB: 1
